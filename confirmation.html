<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
 <meta name="viewport" content="width=1080">
<title>ProLevelFormation — Paiement confirmé</title>
<style>
  :root{
    --navy-dark:#0a1f3d;
    --navy-deep:#081733;
    --orange:#f7941e;
    --orange-light:#ffb347;
    --white:#ffffff;
    --gray:#5b6472;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'times new roman', Arial, sans-serif; background:#eef4fb; color:var(--navy-dark); }

  header{
    display:flex; align-items:center; justify-content:center;
    padding:18px 48px; background:var(--white);
  }
  .logo-block{ display:flex; align-items:center; gap:12px; }
  .logo-icon{ width:44px; height:44px; flex-shrink:0; }
  .logo-text h1{ font-size:50px; line-height:1; color:var(--navy-dark); }
  .logo-text h1 span{ color:var(--orange); }
  .logo-text p{ font-size:30px; letter-spacing:0.5px; color:var(--gray); margin-top:2px; }

  .stepper{
    max-width:1000px; margin:34px auto 0; display:flex;
    align-items:flex-start; justify-content:space-between; padding:0 24px;
  }
  .step{ display:flex; flex-direction:column; align-items:center; gap:10px; position:relative; flex:1; }
  .step-circle{
    width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:1000; font-size:50px; color:#ffffff; background:#c3ccdb; z-index:2;
  }
  .step.done .step-circle{ background:#2e9e6b; }
  .step.current .step-circle{ background:#2f7fe0; }
  .step-label{ font-size:30px; font-weight:700; color:var(--gray); text-align:center; }
  .step.current .step-label, .step.done .step-label{ color:var(--navy-dark); }
  .step-line{ position:absolute; top:19px; left:50%; width:100%; height:2px; background:#c3ccdb; z-index:1; }
  .step.done .step-line{ background:#2e9e6b; }
  .step:last-child .step-line{ display:none; }

  .confirm-wrap{
    max-width:840px; margin:60px auto 80px; padding:0 24px;
    display:flex; justify-content:center;
  }
  .confirm-card{
    width:300%;
    background:#ffffff;
    border-radius:22px;
    box-shadow:0 30px 90px rgba(10,31,61,0.10);
    padding:90px 90px;
    text-align:center;
  }
  .check-circle{
    width:110px; height:110px; border-radius:50%;
    background:#e5f7ee;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 26px;
  }
  .confirm-card h2{ font-size:70px; color:var(--navy-dark); margin-bottom:14px; }
  .confirm-card p{ font-size:60px; color:var(--gray); line-height:1.6; margin-bottom:8px; }
  .confirm-amount{
    display:inline-block;
    background:#f3f7fc;
    color:var(--navy-dark);
    font-weight:1000;
    font-size:50px;
    padding:10px 22px;
    border-radius:14px;
    margin:18px 0 30px;
  }
  .continue-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--orange);
    color:#ffffff;
    font-weight:1000;
    font-size:50px;
    padding:16px 32px;
    border:none;
    border-radius:14px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(247,148,30,0.35);
  }
  .continue-btn:hover{ background:#e8850f; }

  @media (max-width:560px){
    header{ padding:14px 20px; }
    .logo-text h1{ font-size:24px; }
    .confirm-card{ padding:36px 24px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,18 90,34 50,50 10,34" fill="#0a1f3d"/>
      <polygon points="50,50 90,34 90,40 50,56" fill="#0a1f3d"/>
      <line x1="24" y1="38" x2="24" y2="58" stroke="#0a1f3d" stroke-width="3"/>
      <circle cx="24" cy="60" r="3.5" fill="#0a1f3d"/>
      <path d="M20 62
               C 30 58, 40 62, 44 72
               C 46 66, 54 62, 62 64
               C 56 66, 52 72, 54 80
               C 46 76, 38 78, 34 84
               C 34 76, 28 68, 18 66
               Z"
            fill="#f7941e"/>
    </svg>
    <div class="logo-text">
      <h1>ProLevel<span>Formation</span></h1>
      <p>APPRENDRE &bull; ENTREPRENDRE &bull; RÉUSSIR</p>
    </div>
  </div>
</header>

<div class="stepper">
  <div class="step done">
    <div class="step-circle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></div>
    <div class="step-line"></div>
    <div class="step-label">Inscription</div>
  </div>
  <div class="step done">
    <div class="step-circle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></div>
    <div class="step-line"></div>
    <div class="step-label">Paiement</div>
  </div>
  <div class="step current">
    <div class="step-circle">3</div>
    <div class="step-line"></div>
    <div class="step-label">Confirmation</div>
  </div>
  <div class="step">
    <div class="step-circle">4</div>
    <div class="step-line"></div>
    <div class="step-label">Accès à la formation</div>
  </div>
</div>

<div class="confirm-wrap">
  <div class="confirm-card">
    <div class="check-circle">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#2e9e6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
    </div>
    <h2>Paiement validé !</h2>
    <p>Ton paiement a bien été reçu et confirmé.</p>
    <div class="confirm-amount">5 000 FCFA payés avec succès</div>
    <br>
    <a href="acces.html" class="continue-btn">
      Continuer &rarr;
    </a>
  </div>
</div>

</body>
</html>
